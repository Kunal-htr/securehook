name: CI/CD - SecureHook Java App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build with Maven
        # Tests are skipped as they require a live PostgreSQL connection
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: securehook-jar
          path: target/securehook-0.0.1-SNAPSHOT.jar
          retention-days: 1

      - name: Build Docker Image (Validation)
        # This step verifies the Docker build but DOES NOT push or deploy it
        run: docker build -t securehook-validation:latest .

  deploy-to-azure:
    needs: build-and-validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: securehook-jar
          path: target/

      - name: Deploy JAR to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'securehook-backend'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'target/securehook-0.0.1-SNAPSHOT.jar'
